image: odoo:17.0

# Run as root to allow installing packages and accessing files
variables:
  POSTGRES_DB: postgres
  POSTGRES_USER: odoo
  POSTGRES_PASSWORD: odoo
  POSTGRES_HOST_AUTH_METHOD: trust

services:
  - postgres:15

stages:
  - test

test_job:
  stage: test
  before_script:
    # The official Odoo image is based on Debian. We need pip to install linting tools.
    - apt-get update && apt-get install -y python3-pip
    # Use --break-system-packages for Debian 12+ compatibility
    - pip3 install --break-system-packages pylint-odoo flake8
  script:
    # 1. Run Linting (set to || true so it doesn't block the build during the hackathon)
    - echo "Running linting..."
    - flake8 custom_addons/ || true
    - pylint --load-plugins=pylint_odoo custom_addons/ || true
    
    # 2. Wait for PostgreSQL service to be ready
    - echo "Waiting for PostgreSQL..."
    - sleep 15
    
    # 3. Run Odoo Tests
    - echo "Running Odoo tests..."
    - odoo --test-enable --stop-after-init --addons-path=custom_addons --db_host=postgres --db_user=odoo --db_password=odoo -d test_db -i my_module
