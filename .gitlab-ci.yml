image: odoo:17.0

services:
  - postgres:15

variables:
  POSTGRES_DB: postgres
  POSTGRES_USER: odoo
  POSTGRES_PASSWORD: odoo
  POSTGRES_HOST_AUTH_METHOD: trust
  # This is important for Odoo to find the database service
  HOST: postgres
  USER: odoo
  PASSWORD: odoo

stages:
  - lint
  - test

lint:
  stage: lint
  before_script:
    - pip3 install pylint-odoo flake8
  script:
    # Allow some leeway for linting in a hackathon
    - flake8 custom_addons/ || true
    - pylint --load-plugins=pylint_odoo custom_addons/ || true

test:
  stage: test
  script:
    # Wait for postgres to be ready
    - sleep 10
    - odoo --test-enable --stop-after-init --addons-path=custom_addons --db_host=postgres --db_user=odoo --db_password=odoo -d test_db -i my_module
