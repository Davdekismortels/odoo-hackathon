version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: traveloop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: traveloop
      POSTGRES_USER: traveloop
      POSTGRES_PASSWORD: traveloop_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for DB browsing during hackathon demo
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: traveloop_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@traveloop.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools  # Only starts with: docker compose --profile tools up

volumes:
  postgres_data:

# Usage:
#   docker compose up -d postgres       # Start only Postgres
#   docker compose --profile tools up   # Start Postgres + pgAdmin
#   docker compose down -v              # Teardown including volumes
#
# To switch from SQLite to Postgres, change DATABASE_URL in .env to:
#   DATABASE_URL=postgresql://traveloop:traveloop_dev@localhost:5432/traveloop
