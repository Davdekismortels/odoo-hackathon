name: Odoo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Run everything in the official Odoo container
    container:
      image: odoo:17.0
      options: --user root

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_HOST_AUTH_METHOD: trust

    env:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_HOST_AUTH_METHOD: trust
      HOST: postgres
      USER: odoo
      PASSWORD: odoo

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y python3-pip
          pip3 install --break-system-packages pylint-odoo flake8

      - name: Lint Code
        run: |
          flake8 custom_addons/ || true
          pylint --load-plugins=pylint_odoo custom_addons/ || true

      - name: Wait for PostgreSQL
        run: sleep 15

      - name: Run Odoo Tests
        run: |
          odoo --test-enable --stop-after-init --addons-path=custom_addons --db_host=postgres --db_user=odoo --db_password=odoo -d test_db -i my_module
